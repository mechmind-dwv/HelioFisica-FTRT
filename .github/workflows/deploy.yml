# .github/workflows/deploy.yml
name: Deploy FTRT System
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Tests
        run: python -m pytest
      - name: Deploy to Production
        run: ./deploy.sh
